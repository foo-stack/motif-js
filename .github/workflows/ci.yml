name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope: every job here only reads the checkout to
# typecheck / lint / build / test — none push, comment, or release.
permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    # The desktop-electron example carries Electron as a dev dependency. This
    # required lane never launches it, so skip the ~150 MB binary download —
    # only the (non-required) Desktop workflow needs the real binary.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      # Bundle-size budgets — fails CI if any package's gzipped
      # `dist/index.js` exceeds the budget in `.size-limits.json`.
      # Run `yarn size:update` locally to rebaseline after a real
      # growth event (and explain the change in the PR).
      - name: Bundle size budgets
        run: yarn size

      # Import-cost guardrail — fails CI if a single named import
      # from a motif package balloons unexpectedly (signals broken
      # tree-shaking or a barrel-export with side effects).
      - name: Tree-shaking check
        run: yarn treeshake

      # Packs every publishable package and reads the manifest back out of the
      # tarball, failing if a Yarn `workspace:` range survived into it. Those
      # strings make a package uninstallable, and a published version cannot be
      # amended — so this has to fail here rather than on the registry.
      - name: Publish manifest check
        run: yarn verify:publish

      # Reads the resolved type of a style prop in a fixture that augments
      # `MotifCustomTheme`, and fails when the token paths are missing. The
      # failure it guards is silent: a prop's value union keeps `(string & {})`
      # so every raw CSS value still compiles, which means a severed
      # augmentation channel produces no error anywhere: the editor just stops
      # suggesting, and nothing else here would notice. Needs `dist`, so it runs
      # after Build.
      - name: Token type check
        run: yarn tokens:check
