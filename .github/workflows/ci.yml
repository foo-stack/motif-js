name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal token scope: every job here only reads the checkout to
# typecheck / lint / build / test — none push, comment, or release.
permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test

      # Bundle-size budgets — fails CI if any package's gzipped
      # `dist/index.js` exceeds the budget in `.size-limits.json`.
      # Run `yarn size:update` locally to rebaseline after a real
      # growth event (and explain the change in the PR).
      - name: Bundle size budgets
        run: yarn size

      # Import-cost guardrail — fails CI if a single named import
      # from a motif package balloons unexpectedly (signals broken
      # tree-shaking or a barrel-export with side effects).
      - name: Tree-shaking check
        run: yarn treeshake
