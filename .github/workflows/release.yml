name: Release

# Publishes the usemotif + @usemotif/* packages from CI so the tarballs carry
# an npm provenance attestation (requires a trusted OIDC context — `id-token:
# write` — which a local `scripts/publish.mjs` run cannot provide). On a push
# to main, changesets either opens/updates the "Version Packages" PR or, once
# that PR is merged and changesets remain consumed, runs the publish.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create tags + the version PR branch
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm provenance via OIDC

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      # This lane never launches Electron; skip the ~150 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: yarn run version
          publish: yarn run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Attach a provenance attestation to every published tarball.
          NPM_CONFIG_PROVENANCE: 'true'
